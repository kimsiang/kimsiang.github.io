<p>After months of hard work by the ZIRC project team, a setup for measuring the atmospheric muon’s polarization is now operating! Looking forward to extracting important information for subsequent studies related to muon polarization.</p>
<div class="pgal"><ul><li><figure><img alt="" decoding="async" height="1600" loading="lazy" src="{ROOT}assets/media/1139.webp" width="1200"/></figure></li><li><figure><img alt="" decoding="async" height="1600" loading="lazy" src="{ROOT}assets/media/1138.webp" width="1200"/><figcaption>The setup consists of 4 planes of detectors where each plane has an array of 6 plastic scintillators</figcaption></figure></li><li><figure><img alt="" decoding="async" height="1600" loading="lazy" src="{ROOT}assets/media/1137.webp" width="1200"/><figcaption>Each scintillator is light-readout by a silicon photomultiplier (SiPM), and the signals are processed using a CAEN DT5702 digitizer.</figcaption></figure></li><li><figure><img alt="" decoding="async" height="720" loading="lazy" src="{ROOT}assets/media/1140.webp" width="1192"/><figcaption>Hit map of a single atmospheric muon event</figcaption></figure></li><li><figure><img alt="" decoding="async" height="362" loading="lazy" src="{ROOT}assets/media/1145.webp" width="599"/><figcaption>Charge/energy distribution of atmospheric muon events</figcaption></figure></li></ul></div>
