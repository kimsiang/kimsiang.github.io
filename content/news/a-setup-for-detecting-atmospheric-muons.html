<p>After months of hard work by the ZIRC project team, a setup for measuring the polarization of atmospheric muons is now in operation! We look forward to extracting important information for subsequent studies of muon polarization.</p>
<div class="pgal"><ul><li><figure><img alt="" decoding="async" height="1600" loading="lazy" src="{ROOT}assets/media/1139.webp" width="1200"/></figure></li><li><figure><img alt="" decoding="async" height="1600" loading="lazy" src="{ROOT}assets/media/1138.webp" width="1200"/><figcaption>The setup consists of 4 detector planes, each with an array of 6 plastic scintillators.</figcaption></figure></li><li><figure><img alt="" decoding="async" height="1600" loading="lazy" src="{ROOT}assets/media/1137.webp" width="1200"/><figcaption>Each scintillator is read out by a silicon photomultiplier (SiPM), and the signals are processed with a CAEN DT5702 digitizer.</figcaption></figure></li><li><figure><img alt="" decoding="async" height="720" loading="lazy" src="{ROOT}assets/media/1140.webp" width="1192"/><figcaption>Hit map of a single atmospheric muon event</figcaption></figure></li><li><figure><img alt="" decoding="async" height="362" loading="lazy" src="{ROOT}assets/media/1145.webp" width="599"/><figcaption>Charge/energy distribution of atmospheric muon events</figcaption></figure></li></ul></div>
