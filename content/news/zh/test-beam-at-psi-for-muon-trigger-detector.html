<p>2024年10月下旬至11月初，课题组赴瑞士保罗谢勒研究所（PSI）参加束流测试，检验为muEDM实验研制的缪子触发探测器原型的性能。这是我们为muEDM项目在PSI开展的第二次束流测试，此次测试了专为强磁场环境运行而改进的设计方案。</p>
<p>特别感谢胡天齐和黄冠铭为研制这一先进、高可靠性的缪子触发探测器所付出的辛勤努力。他们的工作对提升探测器在严苛实验条件下的性能起到了关键作用。未来几个月，我们将对采集的数据进行分析，以评估探测器性能。</p>
