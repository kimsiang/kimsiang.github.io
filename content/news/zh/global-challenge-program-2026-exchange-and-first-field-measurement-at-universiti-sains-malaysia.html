<p>在槟城，团队走访马来西亚理科大学（USM），围绕宇宙线物理、缪子探测、数据采集与图像分析作学术报告并开展技术交流。USM在地球物理与环境监测领域积淀深厚，与缪子成像技术形成良好互补。</p>
<figure><img alt="在马来西亚理科大学交流" decoding="async" height="534" loading="lazy" src="{ROOT}assets/media/gcp26-usm.webp" width="800"/><figcaption>在马来西亚理科大学交流</figcaption></figure>
<p>此行的首次实地测量也在这里进行：团队在USM校内的防空洞中部署了便携式缪子探测器。这是课题组在马来西亚真实建筑中开展的首次演示性测量，用于在怡保和吉隆坡的测量之前检验探测器部署、数据采集及现场条件。双方就开展联合研究、拓展应用场景达成了初步共识。</p>
<figure><img alt="在USM防空洞内测量" decoding="async" height="600" loading="lazy" src="{ROOT}assets/media/gcp26-shelter.webp" width="800"/><figcaption>在USM防空洞内测量</figcaption></figure>
<p>本次交流是课题组2026“全球挑战计划”马来西亚半岛之行（8月4日至11日）的一站。查看<a href="{ROOT}news/global-challenges-program-2026-muography-field-survey-in-malaysia.html">行程总结</a>，或阅读<a href="https://news.sjtu.edu.cn/zhxw/20260918/226041.html" target="_blank" rel="noopener">上海交通大学新闻网</a>的相关报道。</p>
