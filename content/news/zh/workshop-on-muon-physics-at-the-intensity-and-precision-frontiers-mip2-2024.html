<p>2024年4月20日至21日，课题组参加了在北京大学举行的强度与精度前沿缪子物理研讨会（MIP2024）。许金祥主持了精密测量分会，竹内 佑甫、何守仁和黄冠铭三位成员作了大会报告，另有九位成员展示了墙报。刘方超、黄俊凯和尚雨芝分别凭借上海缪子源、Muon g-2实验和muEDM实验相关工作荣获最佳墙报奖，祝贺他们！研讨会详情请见<a href="https://indico.cern.ch/event/1356341/" rel="noopener" target="_blank">https://indico.cern.ch/event/1356341/</a>。下一届MIP2025将由湖南大学在长沙承办，我们满怀期待！</p>
