<p>9月16日至21日，许金祥参加了在美国阿贡国家实验室举行的 NuFact 2024 会议，担任第四工作组（缪子物理）召集人，并作了关于 PSI muEDM 实验现状的报告。时隔五年再次赴美，并与来自日本、欧洲和美国的许多老朋友重聚，令人十分欣喜。除了丰富的物理议程外，会议还安排参观了 DUNE 阴极生产工厂、阿贡尾场加速器（AWA）、先进光子源（APS）以及纳米材料中心（CNM）。更多会议信息请见：<a href="https://indico.fnal.gov/event/63406/" target="_blank" rel="noopener">https://indico.fnal.gov/event/63406/</a>。</p>
