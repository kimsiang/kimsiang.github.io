<p>许金祥近日应邀在2023年11月27日至12月1日于德国汉堡电子同步加速器研究所（DESY）举行的ICFA研讨会2023（主题：“高能物理的未来展望”）上作电磁偶极矩综述报告。该研讨会是聚焦粒子物理未来装置规划的国际交流会议，仅限受邀参加，与会者包括全球大多数主要粒子物理实验室的负责人、资深粒子物理与加速器物理学家，以及多个国家的政府科技官员。会议详情请见：<a href="https://indico.desy.de/event/38293/" rel="noopener" target="_blank">https://indico.desy.de/event/38293/</a>。</p>
