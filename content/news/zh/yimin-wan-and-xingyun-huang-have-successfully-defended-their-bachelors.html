<p>2024年6月4日，万一民和黄幸运顺利通过本科毕业论文答辩，论文题目分别为“火花室框架结构、气体系统与相机系统的设计与搭建”和“基于火花室的缪子质量测量”。课题组全体成员向他们表示祝贺！黄幸运将留在课题组攻读博士学位，从事PSI muEDM项目研究；万一民将进入中国科学院上海高等研究院，攻读微电子学与固体电子学硕士学位。</p>
