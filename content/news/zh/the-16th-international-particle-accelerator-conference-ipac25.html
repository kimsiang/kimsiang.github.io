<p>竹内佑甫博士近日参加了2025年6月1日至6日在台北举行的<a href="https://indico.jacow.org/event/81" target="_blank" rel="noopener">第十六届国际粒子加速器会议（IPAC’25）</a>。IPAC是加速器领域规模最大的国际会议，本届参会人数达1000人。他展示了关于缪子源设计研究的墙报，题为“基于电子加速器的kHz–MHz重复频率脉冲缪子源设计研究”。会议详情请访问<a href="https://ipac25.org/" target="_blank" rel="noopener">https://ipac25.org/</a>。</p>
<figure><img alt="" decoding="async" height="412" loading="lazy" src="{ROOT}assets/media/2367.webp" width="618"/></figure>
<blockquote><p>“我与许多专家进行了富有意义的交流，了解了加速器物理的最新研究动态。未来轻子对撞机（包括缪子对撞机）研究的蓬勃势头，以及先进束流动力学模拟工具的发展（Xsuite现已具备自旋追踪功能），都给我留下了深刻印象。”——竹内佑甫</p></blockquote>
