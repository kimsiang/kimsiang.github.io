<p>近日，课题组成员参加了2025年9月1日至6日在成都都江堰举行的 PPTT 2025 研讨会。本次“桌面粒子物理”（Particle Physics on Tabletops）研讨会汇聚了来自不同领域的专家，共同探讨利用桌面实验探索基础粒子物理的潜力，推动这一新兴领域的跨学科与国际合作。</p>
<p><strong>饶倍宁</strong>和<strong>黄冠铭</strong>在会上进行了墙报展示。饶倍宁展示了题为“利用正交正电子偶素检验 QED 及超越 QED 的物理”的工作，黄冠铭则介绍了“PSI muEDM 实验缪子触发探测器原型机研制”的最新进展。</p>
<p>研讨会详情请见<a href="https://www.xplorersymposia.org.cn/detail?id=356405852590080000" rel="noopener" target="_blank">此处</a>。</p>
