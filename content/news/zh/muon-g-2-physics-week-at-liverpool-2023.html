<p>许金祥参加了在英国利物浦举行的Muon g-2合作组物理周，这是他自2019年加入李政道研究所以来首次线下参加物理周。他汇报了上海交通大学团队在进动频率分析方面的最新进展，共同组织了进动频率分析研讨会，并在束流动力学研讨会上作了关于探测器接受度的报告。这些成果离不开陈程、曾永浩和黄俊凯过去几个月来的持续贡献。</p>
