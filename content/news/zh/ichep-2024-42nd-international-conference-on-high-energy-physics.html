<p>许金祥近日参加了在捷克布拉格会议中心举行的ICHEP 2024第42届国际高能物理大会（7月17日至24日）。他代表费米实验室Muon g-2合作组在夸克与轻子味物理分会场作了题为“<a href="https://indico.cern.ch/event/1291157/contributions/5878474/" rel="noopener" target="_blank">费米实验室Muon g-2实验Run-2/3缪子反常磁矩测量</a>”的报告，并展示了题为“<a href="https://indico.cern.ch/event/1291157/contributions/5906007/" rel="noopener" target="_blank">缪子反常磁矩测量中的束流动力学修正</a>”的墙报。此行收获颇丰：他了解了领域最新进展，汲取了探测器研制与科学传播方面的实用经验，更重要的是与老朋友再度相聚。会议详情请见：<a href="https://indico.cern.ch/event/1291157/overview" target="_blank" rel="noopener">https://indico.cern.ch/event/1291157/overview</a>。</p>
