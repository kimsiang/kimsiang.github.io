<p>4月15日至16日，许金祥赴PSI参加2023年缪子电偶极矩（muEDM）合作组四月会议，这也是他三年来首次国际出差。他介绍了李政道研究所对合作组的贡献——2022年11月束流测试中使用的缪子望远镜探测器。为期两天的会议成果丰硕，物理与技术讨论充分深入，PSI OASE餐厅的美食也令人难忘。</p>
