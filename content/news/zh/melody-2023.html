<p>近日，课题组参加了2023年11月3日至6日在中国散裂中子源（CSNS）举行的首届缪子科学技术与产业研讨会（MELODY 2023）。许金祥介绍了课题组在上海缪子源、费米实验室缪子 g-2 实验和 PSI muEDM 实验方面的工作。这些进展离不开课题组全体成员的辛勤付出！更多会议信息请见：<a href="https://indico.ihep.ac.cn/event/20601/" rel="noopener" target="_blank">https://indico.ihep.ac.cn/event/20601/</a>。 </p>
