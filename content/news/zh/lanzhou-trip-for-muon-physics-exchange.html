<p>3月3日至4日，许金祥在上海市政府多位相关负责同志的陪同下首次赴兰州，与刘志毅教授团队就缪子成像开展学术交流。他还在中国科学院近代物理研究所作了缪子物理学术报告，并深入参观了近代物理所的加速器装置，令人大开眼界。此行收获颇丰：我们从刘教授团队学到了许多缪子成像方面的经验，并与兰州大学和近代物理所就未来合作进行了深入探讨。期待下一次的访问！</p>
