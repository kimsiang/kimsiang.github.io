<p>课题组2026“全球挑战计划”马来西亚之行的第一站，是许金祥的母校——槟城钟灵中学。许金祥以校友身份为中学生们举办科普讲座，介绍宇宙线缪子从何而来、如何探测，以及如何利用缪子“透视”大型结构。</p>
<figure><img alt="在钟灵中学举办科普讲座" decoding="async" height="534" loading="lazy" src="{ROOT}assets/media/gcp26-clhs.webp" width="800"/><figcaption>在钟灵中学举办科普讲座</figcaption></figure>
<p>随后，两位交大学生分享了各自的成长经历：留学生戴颀恩（Qee Enn Tai）讲述了在上海交大的学习与生活，本科生李逸飞则分享了从课堂走向科研的体会。这场讲座拉开了此行学术交流的序幕，团队随后前往槟城、吉隆坡和柔佛的多所高校。</p>
<p>本次交流是课题组2026“全球挑战计划”马来西亚半岛之行（8月4日至11日）的一站。查看<a href="{ROOT}news/global-challenges-program-2026-muography-field-survey-in-malaysia.html">行程总结</a>，或阅读<a href="https://news.sjtu.edu.cn/zhxw/20260918/226041.html" target="_blank" rel="noopener">上海交通大学新闻网</a>的相关报道。</p>
