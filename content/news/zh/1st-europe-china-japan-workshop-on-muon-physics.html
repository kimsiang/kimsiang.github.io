<p>2025年3月24日至25日，课题组参加了在上海交通大学闵行校区举行的<a href="https://indico-tdli.sjtu.edu.cn/event/3895/" target="_blank" rel="noopener">第一届欧洲—中国—日本缪子物理研讨会</a>。许金祥作了关于 SHINE 缪子源的报告，介绍了该项目的最新进展。会后，与会者在 SHINE 合作者的陪同下参观了上海光源（SSRF）和 SHINE 装置。本次研讨会取得圆满成功，围绕缪子物理激发了许多富有启发的讨论。更多会议信息请见：<a href="https://indico-tdli.sjtu.edu.cn/event/3895/" target="_blank" rel="noopener">https://indico-tdli.sjtu.edu.cn/event/3895/</a>。</p>
