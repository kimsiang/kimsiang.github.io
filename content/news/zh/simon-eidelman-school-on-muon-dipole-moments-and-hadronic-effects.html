<p>2024年9月2日至6日，由名古屋大学小林·益川研究所（KMI）主办的Simon Eidelman缪子偶极矩与强子效应暑期学校举行，课题组积极参与。竹内 佑甫、何守仁、曾永浩和刘方超在墙报环节展示了各自在SHINE缪子源和Muon g-2实验方面的最新研究。值得一提的是，何守仁关于Muon g-2量能器能量刻度的工作荣获最佳墙报奖！<br/><br/>学校详情请见<a href="https://indico.kmi.nagoya-u.ac.jp/event/8/overview" rel="noopener" target="_blank">https://indico.kmi.nagoya-u.ac.jp/event/8/overview</a>。</p>
