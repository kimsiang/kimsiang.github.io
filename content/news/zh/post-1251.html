<p>6月19日至20日，许金祥参加了在中国科学院近代物理研究所新建成的惠州园区举行的缪子束物理与应用研讨会，并在会上介绍了他提出的基于上海高重频硬X射线自由电子激光装置（SHINE）的高重频脉冲缪子源构想。参观先进的近代物理研究所园区和在建装置，使此行既富有启发又十分愉快。</p>
