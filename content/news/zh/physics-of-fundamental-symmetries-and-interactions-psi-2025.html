<p>课题组<strong>饶倍宁</strong>近日参加了在瑞士保罗谢勒研究所（PSI）举行的<a href="https://indico.psi.ch/event/16492/" target="_blank" rel="noopener">基本对称性与相互作用物理研讨会（PSI2025）</a>（2025年9月7日至12日）。该研讨会聚焦利用PSI独特装置开展的现有及未来高精度低能物理研究，这些装置包括世界上最强的质子回旋加速器、高强度低动量缪子束流和超冷中子源，会议也涵盖了与之互补的其他实验途径。饶倍宁以“Testing QED and Beyond with ortho-Positronium”（利用正电子偶素检验QED及新物理）为题展示了墙报。</p>
