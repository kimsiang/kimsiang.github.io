<p>此行最后一所走访的高校是位于柔佛的马来西亚理工大学（UTM）。团队成员围绕宇宙线物理、缪子探测、数据采集与图像分析作报告，并演示了课题组的便携式缪子成像探测器。</p>
<p>除UTM科研人员外，马来西亚原子能执照局及一家高速公路公司的代表也参与了交流，话题从测量原理延伸到监管问题和交通基础设施中的实际应用。双方就开展联合研究、拓展应用场景达成了初步共识。</p>
<p>本次交流是课题组2026“全球挑战计划”马来西亚半岛之行（8月4日至11日）的一站。查看<a href="{ROOT}news/global-challenges-program-2026-muography-field-survey-in-malaysia.html">行程总结</a>，或阅读<a href="https://news.sjtu.edu.cn/zhxw/20260918/226041.html" target="_blank" rel="noopener">上海交通大学新闻网</a>的相关报道。</p>
