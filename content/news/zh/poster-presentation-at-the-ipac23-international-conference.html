<p>吕濛和王江涛在2023年5月7日至12日于意大利威尼斯举行的第14届国际粒子加速器大会（IPAC’23）上展示了上海缪子源项目墙报。大会在威尼斯的一座小岛上举行，吸引了1000多名代表参会，安排了丰富的报告、墙报展示和社交活动。大会详情请见：<a href="https://www.ipac23.org/" target="_blank" rel="noopener">https://www.ipac23.org/</a>。</p>
