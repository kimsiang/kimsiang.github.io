<p>课题组今年夏天将通过上海交通大学暑期科研实习项目招收学生！我们的项目是<strong>基础与应用缪子物理：利用桌面实验测量缪子性质，以及利用缪子成像探测器进行三维密度成像</strong>。<br/><br/>申请条件：<br/>– 已完成至少一年本科学习，且目前为在读本科生；<br/>– GPA不低于3.0（4.0制）或同等水平；<br/>– 来自非英语国家的学生须提供英语水平证明。</p>
<p><strong>项目时间为2025年6月30日至8月10日，申请截止日期为5月30日。<br/></strong><br/>实习项目<strong>（项目154）</strong>详情请参阅项目手册：<a href="https://global.sjtu.edu.cn/en/news/view/718" rel="noopener" target="_blank">https://global.sjtu.edu.cn/en/news/view/718</a>。</p>
