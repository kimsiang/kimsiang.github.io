<p>许金祥近日参加了在韩国大田基础科学研究院（IBS）举行的PPC 2023会议（6月12日至16日）。他代表费米实验室Muon g-2合作组，在味物理大会报告分会上作了题为“Muon g-2实验”的报告。详情请见会议网页：<a href="https://indico.ibs.re.kr/event/540/" rel="noopener" target="_blank">https://indico.ibs.re.kr/event/540/</a>。时隔四年再次线下参加国际会议，收获颇丰。尤为特别的是，这也是许金祥自2006年以来首次重返韩国。</p>
