<p>许金祥代表加速器粒子物理实验组在上海市和教育部重点实验室年度学术委员会会议上作工作汇报，介绍了实验组在三个主要方向上的进展：对撞机实验（ATLAS和CEPC）、固定靶实验（Dark SHINE）以及储存环实验（Muon g-2和muEDM）。2023年各项工作取得了长足进展，期待2024年再创佳绩！</p>
