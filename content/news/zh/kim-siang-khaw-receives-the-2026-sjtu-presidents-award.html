<p>许金祥荣获<strong>2026年上海交通大学校长奖</strong>。校长奖是学校授予教职工的最高精神荣誉，旨在表彰在工作中充分体现交大精神的教职员工。</p>
<figure><img alt="许金祥与上海交通大学校长丁奎岭在130周年校庆背景板前手持2026年校长奖奖杯合影" decoding="async" height="1067" loading="lazy" src="{ROOT}assets/media/sjtu-presidents-award-2026-portrait.webp" width="1600"/><figcaption>在130周年校庆活动上与上海交通大学校长丁奎岭合影</figcaption></figure>
<p>颁奖仪式于2026年4月6日在闵行校区霍英东体育中心举行，恰逢上海交通大学2026年全球校友返校日暨建校130周年庆祝活动。今年共有10位个人和团队获此殊荣。</p>
