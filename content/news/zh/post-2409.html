<p>2025年9月18日至22日，<a href="https://indico.ihep.ac.cn/event/26398/" target="_blank" rel="noopener">第七届粒子物理天问论坛</a>在中国地质大学（武汉）举行。论坛由湖南大学、中南大学等多所高校联合主办，旨在加强学术合作，探讨粒子物理的未来发展方向及我国重大科学工程的规划布局。会议议程涵盖众多实验平台以及该领域最新的交叉研究进展。</p>
<p>论坛期间，课题组博士研究生<strong>曾永浩</strong>应邀作了题为“Muon g-2 Status”的报告，全面介绍了国际缪子反常磁矩（Muon g-2）实验——一项寻找超出标准模型新物理的高精度实验——的最新进展、当前挑战与未来路线图，引发了与会者的热烈讨论。</p>
