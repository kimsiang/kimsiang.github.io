<p>在厦门大学马来西亚分校（XMUM），团队成员围绕宇宙线物理、缪子探测、数据采集与图像分析作报告并进行探测器演示，并与校方代表及中国交通建设（马来西亚）有限公司进行了交流。</p>
<figure><img alt="在厦门大学马来西亚分校交流" decoding="async" height="534" loading="lazy" src="{ROOT}assets/media/gcp26-xmum.webp" width="800"/><figcaption>在厦门大学马来西亚分校交流</figcaption></figure>
<p>三方达成初步合作意向，将共同推动缪子成像技术在马来西亚本地基础设施领域落地应用——从隧道、道路到其他需要无损检测的结构。</p>
<p>本次交流是课题组2026“全球挑战计划”马来西亚半岛之行（8月4日至11日）的一站。查看<a href="{ROOT}news/global-challenges-program-2026-muography-field-survey-in-malaysia.html">行程总结</a>，或阅读<a href="https://news.sjtu.edu.cn/zhxw/20260918/226041.html" target="_blank" rel="noopener">上海交通大学新闻网</a>的相关报道。</p>
