<p>课题组正在招收今年上海交通大学暑期科研实习项目的学生！我们的项目为在李政道研究所实验室中<strong>利用桌面实验装置测量缪子性质</strong>。<br/><br/>申请条件：<br/>– 申请人须已完成至少一年本科学习，且目前为在读本科生；<br/>– 申请人GPA须不低于3.0（4.0分制）或同等水平；<br/>– 来自非英语国家的申请人须提供英语水平证明。<br/><br/><strong>项目时间为2024年7月1日至8月11日，申请截止日期为5月30日。<br/></strong><br/>实习项目详情请见宣传手册：https://global.sjtu.edu.cn/en/news/view/718。</p>
