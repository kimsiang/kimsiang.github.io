<p>近日，课题组参加了5月17日至19日在长沙湖南大学举行的 MIP2025 研讨会。许金祥主持了缪子束缚态分会，课题组三位成员（竹内佑甫、黄冠铭和 Siew Yan）分别作大会报告，介绍了上海缪子源、muEDM 实验以及面向教育、科研与科普的上海 METRO 平台的相关工作。更多会议信息请访问 <a href="https://indico.ihep.ac.cn/event/24109/" rel="noopener" target="_blank">https://indico.ihep.ac.cn/event/24109/</a>。下一届会议 <a href="https://indico.itp.ac.cn/event/384" target="_blank" rel="noopener">MIP2026</a> 将由中国科学院近代物理研究所在惠州承办，我们对此充满期待！</p>
