<p>课题组今年夏季将通过上海交通大学暑期科研实习项目招收学生！我们的项目为<strong>基础与应用缪子物理，内容包括利用桌面实验测量缪子性质，以及利用缪子成像探测器进行三维密度成像</strong>。<br/><br/>申请条件：<br/>– 申请人须已完成至少一年本科学习，且目前为在读本科生；<br/>– 申请人GPA须不低于3.0（4.0分制）或同等水平；<br/>– 来自非英语国家的申请人须提供英语水平证明。</p>
<p><strong>项目时间为2026年7月13日至8月23日。请于2026年5月30日前提交申请。<br/></strong><br/>有关本实习项目<strong>（项目编号161）</strong>的更多信息，请访问项目网站：<a href="https://global.sjtu.edu.cn/summer-program/index.php" rel="noopener" target="_blank">https://global.sjtu.edu.cn/summer-program/index.php</a>。</p>
